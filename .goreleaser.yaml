# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# See https://goreleaser.com. macOS and Linux only: no Windows (see AGENTS.md).

version: 2

project_name: clical

builds:
  - id: clical
    main: ./cmd/clical
    binary: clical
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: clical
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md
      - ADDITIONAL-PERMISSION.md
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # v0.x tags are marked as pre-releases on GitHub.
  prerelease: auto
